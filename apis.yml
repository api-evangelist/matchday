name: Matchday
description: >-
  Matchday is a consumer mobile platform for collecting officially licensed digital
  football (soccer) player cards and building a squad, surfaced in the API Evangelist
  network as a portfolio company of Andreessen Horowitz (a16z). The product is a
  business-to-consumer collecting and squad-building experience delivered through its
  mobile apps and website at matchday.com. As of this enrichment pass, Matchday does
  not publish a public developer API, developer portal, OpenAPI specification, or
  documentation surface: probing api.matchday.com, docs.matchday.com, and
  developer.matchday.com returned no reachable developer hosts, and the marketing site
  is a single-page application. This profile therefore carries company identity plus a
  domain-security probe rather than API artifacts, and remains a lead to revisit if a
  public API surface is launched.
